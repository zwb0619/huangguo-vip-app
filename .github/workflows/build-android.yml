name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Fix android/settings.gradle and Global Kotlin Version
        run: |
          # 1. 动态重写 settings.gradle 修复绝对路径问题
          cat << 'EOF' > android/settings.gradle
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "7.3.0" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }

          include ":app"
          EOF

          # 2. 全局搜索并干掉所有 build.gradle 中硬编码锁死旧版 Kotlin (如 1.6) 的限制
          find android -name "build.gradle" | while read file; do
            echo "Cleaning Kotlin version locks in $file"
            sed -i 's/kotlin-gradle-plugin:[0-9]\.[0-9]\.[0-9]*/kotlin-gradle-plugin:1.9.22/g' "$file" || true
            sed -i 's/ext\.kotlin_version[[:space:]]*=[[:space:]]*'\''[0-9]\.[0-9]\.[0-9]*'\''/ext.kotlin_version = '\''1.9.22'\''/g' "$file" || true
            sed -i 's/ext\.kotlin_version[[:space:]]*=[[:space:]]*"[0-9]\.[0-9]\.[0-9]*"/ext.kotlin_version = "1.9.22"/g' "$file" || true
            sed -i 's/version "[0-9]\.[0-9]\.[0-9]*"/version "1.9.22"/g' "$file" || true
            # 移除所有强制限定 languageVersion 或 apiVersion 为 1.6 的语句
            sed -i '/languageVersion/d' "$file" || true
            sed -i '/apiVersion/d' "$file" || true
          done

          # 3. 在根 build.gradle 底部注入一段强制所有子模块统一使用 1.9 编译的钩子
          if [ -f "android/build.gradle" ]; then
            echo "" >> android/build.gradle
            echo "allprojects { tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { kotlinOptions { jvmTarget = '1.8' } } }" >> android/build.gradle
          fi

      - name: Clean and Pub Get
        run: |
          flutter clean
          flutter pub get

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: huangguo-vip-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
