name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Fix android/settings.gradle and Kotlin version
        run: |
          # 1. 重写 settings.gradle
          cat << 'EOF' > android/settings.gradle
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "7.3.0" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }

          include ":app"
          EOF

          # 2. 深度排查并把所有 build.gradle 里的旧版 kotlin 版本号统统替换为 1.9.22 (注意这里用正确的 done 结尾)
          find android -name "build.gradle" | while read file; do
            echo "Upgrading Kotlin in $file"
            sed -i 's/kotlin-gradle-plugin:1\.[0-9]\.[0-9]*/kotlin-gradle-plugin:1.9.22/g' "$file" || true
            sed -i 's/ext\.kotlin_version = .*/ext.kotlin_version = '\''1.9.22'\''/g' "$file" || true
            sed -i 's/version "1\.[0-9]\.[0-9]*"/version "1.9.22"/g' "$file" || true
          done

      - name: Clean and Pub Get
        run: |
          flutter clean
          flutter pub get

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: huangguo-vip-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
