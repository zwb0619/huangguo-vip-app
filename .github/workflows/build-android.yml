name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Fix local path in settings.gradle
        run: |
          # 自动清理掉 settings.gradle 中硬编码的错误本地路径
          sed -i '/octop-native/d' android/settings.gradle || true

      - name: Clean and Pub Get
        run: |
          flutter clean
          flutter pub get

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: huangguo-vip-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
